[project]
name = "slotbook-backend"
version = "0.1.0"
description = "SlotBook appointment booking API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn>=0.35,<1.0",
    "argon2-cffi>=25,<26",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.18,<2.0",
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.2,<2.0",
    "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
