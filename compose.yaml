services:
  redis:
    image: redis:8.2-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, noeviction, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: slotbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slotbook_local_only}
      POSTGRES_DB: slotbook
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotbook -d slotbook"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
