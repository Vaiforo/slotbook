name: slotbook-production
x-api: &api
  image: slotbook-api:${IMAGE_TAG:-local}
  build: ./backend
  environment:
    SLOTBOOK_ENVIRONMENT: production
    SLOTBOOK_PUBLIC_ORIGIN: ${SLOTBOOK_PUBLIC_ORIGIN:?Set the public HTTPS origin}
    SLOTBOOK_DATABASE_URL: ${SLOTBOOK_DATABASE_URL:?Set the database URL with host db}
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: slotbook
      POSTGRES_DB: slotbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U slotbook -d slotbook"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *api
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  nginx:
    image: slotbook-web:${IMAGE_TAG:-local}
    build: ./frontend
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, http://127.0.0.1/health/ready]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres_data:
