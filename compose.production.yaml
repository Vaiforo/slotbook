name: slotbook-production
x-api: &api
  image: slotbook-api:${IMAGE_TAG:-local}
  build: ./backend
  environment:
    SLOTBOOK_ENVIRONMENT: production
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},mail-provider
    no_proxy: ${NO_PROXY:-localhost,127.0.0.1},mail-provider
    SLOTBOOK_BROKER_URL: amqp://slotbook:${RABBITMQ_PASSWORD:?Set a broker password}@rabbitmq:5672//
    SLOTBOOK_EMAIL_URL: ${SLOTBOOK_EMAIL_URL:-http://mail-provider:8001/messages}
    SLOTBOOK_EMAIL_API_KEY: ${SLOTBOOK_EMAIL_API_KEY:-}
    SLOTBOOK_NOTIFICATION_MAX_ATTEMPTS: ${SLOTBOOK_NOTIFICATION_MAX_ATTEMPTS:-5}
    SLOTBOOK_AI_MODEL: ${SLOTBOOK_AI_MODEL:-}
    SLOTBOOK_AI_API_KEY: ${SLOTBOOK_AI_API_KEY:-}
    SLOTBOOK_AI_URL: ${SLOTBOOK_AI_URL:-https://api.openai.com/v1/chat/completions}
    SLOTBOOK_AI_TIMEOUT_SECONDS: ${SLOTBOOK_AI_TIMEOUT_SECONDS:-8}
    SLOTBOOK_AI_DAILY_REQUEST_LIMIT: ${SLOTBOOK_AI_DAILY_REQUEST_LIMIT:-100}
    SLOTBOOK_AI_LIMIT: ${SLOTBOOK_AI_LIMIT:-5}
    SLOTBOOK_REDIS_URL: ${SLOTBOOK_REDIS_URL:-redis://redis:6379/0}
    SLOTBOOK_LOGIN_LIMIT: ${SLOTBOOK_LOGIN_LIMIT:-10}
    SLOTBOOK_BOOKING_LIMIT: ${SLOTBOOK_BOOKING_LIMIT:-20}
    SLOTBOOK_RATE_WINDOW_SECONDS: ${SLOTBOOK_RATE_WINDOW_SECONDS:-60}
    SLOTBOOK_RATE_PREFIX: ${SLOTBOOK_RATE_PREFIX:-slotbook:rate:v1}
    SLOTBOOK_PUBLIC_ORIGIN: ${SLOTBOOK_PUBLIC_ORIGIN:?Set the public HTTPS origin}
    SLOTBOOK_DATABASE_URL: ${SLOTBOOK_DATABASE_URL:?Set the database URL with host db}
services:
  rabbitmq:
    image: rabbitmq:4.1-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: slotbook
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set a broker password}
    volumes: [rabbit_data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  mail-provider:
    image: slotbook-api:${IMAGE_TAG:-local}
    command: [uvicorn, scripts.mail_provider:app, --host, 0.0.0.0, --port, "8001", --no-access-log]
    # Synthetic receipts only; no contacts or message bodies are retained.
    tmpfs: ["/data:uid=10001,gid=10001,mode=0700"]
    restart: unless-stopped
  worker:
    <<: *api
    command: [celery, -A, app.notifications.queue:celery, worker, --concurrency=2, --loglevel=WARNING]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
  dispatcher:
    <<: *api
    command: [python, -m, app.notifications.dispatcher]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
  catalog-scheduler:
    <<: *api
    command: [python, -m, app.catalog.scheduler]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, noeviction, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: slotbook
      POSTGRES_DB: slotbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U slotbook -d slotbook"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *api
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  nginx:
    image: slotbook-web:${IMAGE_TAG:-local}
    build: ./frontend
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, http://127.0.0.1/health/ready]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  rabbit_data:
  postgres_data:
