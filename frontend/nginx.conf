limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=booking:10m rate=10r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 16k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    # Docker DNS must be consulted again after a container address changes.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $api_backend api:8000;
    proxy_next_upstream off;
    proxy_set_header Host $http_host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    limit_req_status 429;
    error_page 413 = @body_limit;
    error_page 502 503 504 = @api_unavailable;
    error_page 429 = @rate_limit;
    location @body_limit {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $request_id always;
        return 413 '{"error":{"code":"payload_too_large","message":"Request body is too large","request_id":"$request_id"}}';
    }
    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $request_id always;
        return 503 '{"error":{"code":"service_unavailable","message":"Service is temporarily unavailable","request_id":"$request_id"}}';
    }
    location @rate_limit {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $request_id always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests","request_id":"$request_id"}}';
    }
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://$api_backend$request_uri;
    }
    location = /api/v1/bookings {
        limit_req zone=booking burst=10 nodelay;
        proxy_pass http://$api_backend$request_uri;
    }
    location ~ ^/(api|health|docs)(/|$)|^/openapi\.json$ {
        proxy_pass http://$api_backend$request_uri;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control no-cache;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
